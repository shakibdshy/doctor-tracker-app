<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="640" fill="#f8fafc"/>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Doctor Tracker — system architecture</text>

  <!-- Browser -->
  <rect x="40" y="60" width="380" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="88" font-size="15" font-weight="700" fill="#0f172a">Browser — React client</text>
  <text x="60" y="112" font-size="12.5" fill="#334155">TanStack Query (cache, optimistic unassign)</text>
  <text x="60" y="131" font-size="12.5" fill="#334155">TanStack Table · React Hook Form + Zod</text>
  <text x="60" y="150" font-size="12.5" fill="#334155">shadcn/ui · Recharts · URL-persisted filters</text>
  <text x="60" y="169" font-size="12.5" fill="#334155">Same-origin fetch → first-party cookies</text>

  <!-- Next.js -->
  <rect x="540" y="60" width="380" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560" y="88" font-size="15" font-weight="700" fill="#0f172a">apps/web — Next.js (Vercel)</text>
  <text x="560" y="112" font-size="12.5" fill="#334155">Server-side session guard (fail-closed)</text>
  <text x="560" y="131" font-size="12.5" fill="#334155">Rewrites: /api/auth/* and /api/v1/* → Express</text>
  <text x="560" y="150" font-size="12.5" fill="#334155">App Router pages · light/dark themes</text>
  <text x="560" y="169" font-size="12.5" fill="#334155">No CORS for browser traffic (ADR-0002)</text>

  <line x1="420" y1="120" x2="536" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="478" y="108" text-anchor="middle" font-size="11.5" fill="#475569">HTTPS</text>

  <!-- Express -->
  <rect x="540" y="240" width="380" height="170" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560" y="268" font-size="15" font-weight="700" fill="#0f172a">apps/server — Express REST API</text>
  <text x="560" y="292" font-size="12.5" fill="#334155">helmet · compression · rate limiting</text>
  <text x="560" y="311" font-size="12.5" fill="#334155">better-auth handler (/api/auth/*)</text>
  <text x="560" y="330" font-size="12.5" fill="#334155">requireAuth → requireCapability (role policy)</text>
  <text x="560" y="349" font-size="12.5" fill="#334155">routes → controllers → services (Zod-validated)</text>
  <text x="560" y="368" font-size="12.5" fill="#334155">Central error handler · {success,data,meta}</text>
  <text x="560" y="387" font-size="12.5" fill="#334155">/health · graceful shutdown</text>

  <line x1="730" y1="180" x2="730" y2="236" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="742" y="212" font-size="11.5" fill="#475569">rewrite (server-to-server)</text>

  <!-- MongoDB -->
  <rect x="540" y="470" width="380" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560" y="498" font-size="15" font-weight="700" fill="#0f172a">MongoDB (Atlas)</text>
  <text x="560" y="522" font-size="12.5" fill="#334155">doctors · patients (doctor ref, null = unassigned)</text>
  <text x="560" y="541" font-size="12.5" fill="#334155">user / session / account (better-auth)</text>
  <text x="560" y="560" font-size="12.5" fill="#334155">Compound indexes: equality → sort → range</text>
  <text x="560" y="579" font-size="12.5" fill="#334155">Anchored prefix search on lowercase shadow fields</text>

  <line x1="730" y1="410" x2="730" y2="466" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="742" y="442" font-size="11.5" fill="#475569">Mongoose (lean, select, aggregation)</text>

  <!-- Shared packages -->
  <rect x="40" y="240" width="380" height="200" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="268" font-size="15" font-weight="700" fill="#0f172a">packages/ — shared workspace libraries</text>
  <text x="60" y="296" font-size="12.5" font-weight="600" fill="#0f172a">auth</text>
  <text x="110" y="296" font-size="12.5" fill="#334155">better-auth config + admin plugin,</text>
  <text x="110" y="313" font-size="12.5" fill="#334155">pure can(role, capability) policy</text>
  <text x="60" y="340" font-size="12.5" font-weight="600" fill="#0f172a">db</text>
  <text x="110" y="340" font-size="12.5" fill="#334155">Mongoose models + indexes,</text>
  <text x="110" y="357" font-size="12.5" fill="#334155">shared Zod schemas (enums, queries)</text>
  <text x="60" y="384" font-size="12.5" font-weight="600" fill="#0f172a">ui</text>
  <text x="110" y="384" font-size="12.5" fill="#334155">shadcn primitives, DataTable, FilterBar,</text>
  <text x="110" y="401" font-size="12.5" fill="#334155">Pagination, StatCard, ConfirmDialog, charts</text>
  <text x="60" y="428" font-size="12.5" font-weight="600" fill="#0f172a">config</text>
  <text x="110" y="428" font-size="12.5" fill="#334155">shared TypeScript configs</text>

  <line x1="420" y1="300" x2="536" y2="300" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="478" y="288" text-anchor="middle" font-size="11.5" fill="#475569">auth + db</text>
  <line x1="420" y1="150" x2="470" y2="150" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="470" y1="150" x2="470" y2="390" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="470" y1="390" x2="424" y2="390" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="478" y="412" font-size="11.5" fill="#475569">ui + shared Zod</text>

  <!-- Legend -->
  <line x1="40" y1="600" x2="80" y2="600" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="90" y="604" font-size="12" fill="#475569">runtime request / data flow</text>
  <line x1="300" y1="600" x2="340" y2="600" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="350" y="604" font-size="12" fill="#475569">compile-time package dependency</text>
</svg>